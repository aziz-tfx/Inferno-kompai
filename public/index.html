<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inferno — заявка</title>
  <style>
    :root { --bg: #0f0f12; --card: #1a1a20; --accent: #ff5722; --text: #f5f5f7; --muted: #9a9aa5; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 420px; background: var(--card);
      padding: 32px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 4px; font-size: 24px; }
    p.sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    input, textarea {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #2c2c34;
      background: #101015; color: var(--text); font-size: 15px;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%; margin-top: 22px; padding: 14px; border: none; border-radius: 10px;
      background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .status { margin-top: 16px; font-size: 14px; min-height: 20px; }
    .status.ok { color: #4caf50; }
    .status.err { color: #ff5252; }
  </style>
</head>
<body>
  <form class="card" id="lead-form">
    <h1>Оставить заявку</h1>
    <p class="sub">Мы свяжемся с вами в ближайшее время</p>

    <label for="name">Имя *</label>
    <input id="name" name="name" type="text" autocomplete="name" required />

    <label for="phone">Телефон *</label>
    <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+7 900 000-00-00" />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" />

    <label for="message">Комментарий</label>
    <textarea id="message" name="message" rows="3"></textarea>

    <button type="submit" id="submit-btn">Отправить</button>
    <div class="status" id="status"></div>
  </form>

  <!-- Мост к встроенной веб-форме amoCRM. Скрытую amo-форму он создаёт сам. -->
  <script src="/amo-bridge.js"></script>
  <script>
    const form = document.getElementById('lead-form');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('submit-btn');

    // Простая проверка на стороне лендинга (имя + хотя бы один контакт).
    function localValidate() {
      const name = form.name.value.trim();
      const phone = form.phone.value.trim();
      const email = form.email.value.trim();
      if (!name) return 'Укажите имя.';
      if (!phone && !email) return 'Укажите телефон или email.';
      return null;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = '';
      statusEl.className = 'status';

      const err = localValidate();
      if (err) {
        statusEl.textContent = err;
        statusEl.className = 'status err';
        return;
      }

      btn.disabled = true;
      statusEl.textContent = 'Отправляем…';

      try {
        // Данные уходят в amoCRM через скрытую amo-форму (её родной amoforms.js).
        const res = await AmoBridge.submit({
          name: form.name.value,
          phone: form.phone.value,
          email: form.email.value,
          message: form.message.value,
        });

        statusEl.textContent = res.confirmed
          ? 'Спасибо! Заявка отправлена.'
          : 'Заявка принята.';
        statusEl.className = 'status ok';
        form.reset();
      } catch (err) {
        statusEl.textContent = 'Не удалось отправить. Попробуйте ещё раз.';
        statusEl.className = 'status err';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
